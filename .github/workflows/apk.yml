name: Build XAU Scanner APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install System & Python Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev automake liblzma-dev lld libltdl-dev patch
          pip install --upgrade pip wheel setuptools
          pip install "Cython==0.29.36" virtualenv
          pip install git+https://github.com/kivy/buildozer.git@master

      - name: Compile Android APK
        run: |
          buildozer android debug

      - name: Upload Ready APK
        uses: actions/upload-artifact@v4
        with:
          name: XAU-Smart-Scanner-APK
          path: bin/*.apk
