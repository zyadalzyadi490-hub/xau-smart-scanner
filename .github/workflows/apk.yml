name: Build XAU Scanner APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Buildozer Directories
        uses: actions/cache@v4
        with:
          path: |
            .buildozer
            ~/.buildozer
          key: buildozer-${{ runner.os }}-v1

      - name: Install System & SDL2 Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk python3-pip \
            autoconf libtool libtool-bin pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 \
            cmake libffi-dev libssl-dev automake liblzma-dev \
            lld libltdl-dev patch gettext build-essential \
            ccache g++ libsqlite3-dev \
            libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev \
            libportmidi-dev libswscale-dev libavformat-dev libavcodec-dev
          pip install --upgrade pip "setuptools<69.0.0" wheel
          pip install "Cython==0.29.36" virtualenv
          pip install git+https://github.com/kivy/buildozer.git@master

      - name: Compile Android APK
        run: |
          yes | buildozer android debug || (tail -n 100 ~/.buildozer/android/platform/build-*/build.log ; exit 1)

      - name: Upload Ready APK
        uses: actions/upload-artifact@v4
        with:
          name: XAU-Smart-Scanner-APK
          path: bin/*.apk
